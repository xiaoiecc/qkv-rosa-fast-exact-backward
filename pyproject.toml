[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qkv-rosa"
version = "0.2.0"
description = "Fast exact counterfactual backpropagation for hard n-bit QKV-ROSA"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch",
]

[tool.setuptools.packages.find]
include = ["qkv_rosa*"]

[tool.setuptools.package-data]
qkv_rosa = ["csrc/*.cpp", "csrc/*.h", "csrc/engine/*.h"]
