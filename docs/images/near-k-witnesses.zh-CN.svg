<rect x="562" y="289" width="56" height="35" rx="5" fill="#eef1f7" stroke="none" stroke-width="2"/>
<text x="590.0" y="314" font-size="20" fill="#18334a" font-weight="400" text-anchor="middle" class="mono">0</text>
<rect x="624" y="289" width="56" height="35" rx="5" fill="#ffe3d8" stroke="#c96345" stroke-width="2"/>
<text x="652.0" y="314" font-size="20" fill="#18334a" font-weight="700" text-anchor="middle" class="mono">0</text>
<rect x="686" y="289" width="56" height="35" rx="5" fill="#eef1f7" stroke="none" stroke-width="2"/>
<text x="714.0" y="314" font-size="20" fill="#18334a" font-weight="400" text-anchor="middle" class="mono">0</text>
<text x="784" y="305" font-size="17" fill="#18334a" font-weight="700" text-anchor="start">报告 r − h，再加上 h</text>
<text x="784" y="328" font-size="15" fill="#18334a" font-weight="400" text-anchor="start">较早半段没有被修改。</text>
<text x="44" y="374" font-size="16" fill="#18334a" font-weight="400" text-anchor="start">橙色格子是本次修改修好的原失配；绿色半段是精确出现的证据。</text>
<rect x="24" y="422" width="1072" height="262" rx="12" fill="#ffffff" stroke="#d8e3eb" stroke-width="1"/>
<text x="44" y="454" font-size="21" fill="#18334a" font-weight="700" text-anchor="start">2  更短的修复要胜出，owner 必须破坏原出现</text>
<text x="44" y="482" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">例：L = 8，原终点 r0 = 12。枚举窗口 [5, 20)，再按 r &lt; t 裁剪。</text>
<rect x="230" y="509" width="43" height="36" rx="3" fill="#cae8e0" stroke="none" stroke-width="1"/>
