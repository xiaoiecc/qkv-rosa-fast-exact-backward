<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc">
<title id="title">用两个半段找全 K 候选</title>
<desc id="desc">两个不相交的半段覆盖不短于原匹配的修复；原匹配受损窗口覆盖更短的赢家。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#43627c"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18334a}.mono{font-family:"DejaVu Sans Mono",monospace}</style>
<rect x="0" y="0" width="1120" height="710" rx="20" fill="#f3f7fa" stroke="none" stroke-width="1"/>
<text x="34" y="46" font-size="28" fill="#18334a" font-weight="700" text-anchor="start">哪些 K 终点有资格挑战原答案？</text>
<text x="34" y="76" font-size="18" fill="#18334a" font-weight="400" text-anchor="start">以 L = 8 为例。一次修改至多碰到其中一个半段。</text>
<rect x="24" y="98" width="1072" height="306" rx="12" fill="#ffffff" stroke="#d8e3eb" stroke-width="1"/>
<text x="44" y="130" font-size="21" fill="#18334a" font-weight="700" text-anchor="start">1  长度至少为 L 的修复，总有一个精确半段</text>
<rect x="247" y="146" width="246" height="26" rx="5" fill="#e8edf9" stroke="none" stroke-width="1"/>
<rect x="495" y="146" width="246" height="26" rx="5" fill="#dcf3ed" stroke="none" stroke-width="1"/>
<text x="369" y="165" font-size="16" fill="#18334a" font-weight="400" text-anchor="middle">较早半段：L − h</text>
<text x="617" y="165" font-size="16" fill="#18334a" font-weight="400" text-anchor="middle">较晚半段：h = floor(L/2)</text>
<text x="44" y="209" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">Q 的末尾</text>
<rect x="252" y="185" width="56" height="35" rx="5" fill="#edf2f7" stroke="none" stroke-width="2"/>
