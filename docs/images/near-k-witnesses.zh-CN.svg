<text x="652.0" y="210" font-size="20" fill="#18334a" font-weight="400" text-anchor="middle" class="mono">1</text>
<rect x="686" y="185" width="56" height="35" rx="5" fill="#edf2f7" stroke="none" stroke-width="2"/>
<text x="714.0" y="210" font-size="20" fill="#18334a" font-weight="400" text-anchor="middle" class="mono">0</text>
<text x="44" y="261" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">修改较早半段</text>
