<text x="634.0" y="560" font-size="15" fill="#18334a" font-weight="400" text-anchor="middle">右延伸 = 5</text>
<text x="44" y="627" font-size="16" fill="#18334a" font-weight="400" text-anchor="start">owner s 在 [r0 − L + 1, r0] 内；较短修复的终点 r = s + a，其中 a &lt; L。</text>
<text x="44" y="655" font-size="16" fill="#18334a" font-weight="700" text-anchor="start">先数清两个出现区间与这个窗口的大小，再决定是否完整枚举。</text>
