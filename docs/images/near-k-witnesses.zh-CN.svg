<text x="784" y="253" font-size="17" fill="#18334a" font-weight="700" text-anchor="start">精确出现终点为 r</text>
<text x="784" y="276" font-size="15" fill="#18334a" font-weight="400" text-anchor="start">较晚半段没有被修改。</text>
<text x="44" y="313" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">修改较晚半段</text>
