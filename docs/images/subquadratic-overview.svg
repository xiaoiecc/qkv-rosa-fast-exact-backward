<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
<title id="title">Subquadratic QKV-ROSA: compressed routes and batched numerical sums</title>
<desc id="desc">An implicit edit by time table becomes affine intervals. Periodic occurrence endpoints are grouped by residue. Interval correlations use direct fringes and cached full-block transforms.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#193047}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.mono{font-family:monospace;font-size:17px}</style>
<rect width="1120" height="840" rx="20" fill="#f4f7fa"/>
<text x="36" y="47" class="title" text-anchor="start">QKV-ROSA: compress routes, then sum their contributions</text>
<text x="36" y="76" class="body" text-anchor="start">One construction for every input; diagrams show representations, not special-case kernels.</text>
