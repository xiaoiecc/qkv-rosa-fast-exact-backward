<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">One Q plateau stream answers all time ranges</title>
<desc id="desc">A toy matrix of deletion-minus-baseline deltas is accumulated with owner range updates. Two time snapshots answer each request, and the same updates give total deletion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#43627c"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18334a}.mono{font-family:"DejaVu Sans Mono",monospace}</style>
<rect x="0" y="0" width="1120" height="650" rx="20" fill="#f3f7fa" stroke="none" stroke-width="1"/>
<text x="34" y="46" font-size="28" fill="#18334a" font-weight="700" text-anchor="start">Q deletion: sweep time, update owner intervals</text>
<text x="34" y="76" font-size="18" fill="#18334a" font-weight="400" text-anchor="start">One emitted plateau serves the complete deletion credit and every requested time range.</text>
<rect x="24" y="98" width="650" height="333" rx="12" fill="#ffffff" stroke="#d8e3eb" stroke-width="1"/>
<rect x="694" y="98" width="402" height="333" rx="12" fill="#ffffff" stroke="#d8e3eb" stroke-width="1"/>
