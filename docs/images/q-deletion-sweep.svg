<text x="372.5" y="329" font-size="20" fill="#18334a" font-weight="400" text-anchor="middle" class="mono">+5</text>
<rect x="414" y="299" width="73" height="46" rx="4" fill="#ccebe1" stroke="none" stroke-width="1"/>
<text x="450.5" y="329" font-size="20" fill="#18334a" font-weight="400" text-anchor="middle" class="mono">+5</text>
