<rect x="333" y="187" width="79" height="161" rx="6" fill="none" stroke="#c48b2d" stroke-width="3"/>
<text x="44" y="377" font-size="18" fill="#18334a" font-weight="700" text-anchor="start">Query: owner 4, rows [8, 10]</text>
<text x="44" y="406" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">Its delta is 0 − 2 + 5 = 3.</text>
<text x="716" y="130" font-size="20" fill="#18334a" font-weight="700" text-anchor="start">Two snapshots at the same owner</text>
<rect x="716" y="158" width="356" height="76" rx="8" fill="#eff3f9" stroke="none" stroke-width="1"/>
<text x="734" y="187" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">Before row 8</text>
<text x="734" y="216" font-size="22" fill="#18334a" font-weight="700" text-anchor="start" class="mono">V_8(4) = 0</text>
<path d="M889,240 L889,270" fill="none" stroke="#43627c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="716" y="280" width="356" height="76" rx="8" fill="#def1e9" stroke="none" stroke-width="1"/>
<text x="734" y="308" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">Before row 11</text>
<text x="734" y="339" font-size="22" fill="#18334a" font-weight="700" text-anchor="start" class="mono">V_11(4) = 3</text>
<text x="716" y="394" font-size="22" fill="#18334a" font-weight="700" text-anchor="start" class="mono">V_11(4) − V_8(4) = 3</text>
<rect x="24" y="450" width="1072" height="175" rx="12" fill="#ffffff" stroke="#d8e3eb" stroke-width="1"/>
<text x="44" y="482" font-size="20" fill="#18334a" font-weight="700" text-anchor="start">Range update on owners [a, b]</text>
<text x="44" y="512" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">Fenwick difference: add(a, +delta), add(b + 1, −delta).</text>
<text x="44" y="542" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">The ordinary difference array receives the same delta for total Q deletion.</text>
<text x="44" y="577" font-size="17" fill="#18334a" font-weight="400" text-anchor="start" class="mono">Deleted score on [l, r] = V(r + 1, u) − V(l, u) + B(r + 1) − B(l)</text>
<text x="44" y="605" font-size="16" fill="#18334a" font-weight="400" text-anchor="start">B is the original-score prefix. Only owner state and two events per request are stored.</text>
</svg>
