<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc">
<title id="title">Find every K challenger with two witnesses</title>
<desc id="desc">Two disjoint halves cover every repair at least as long as the baseline; a bounded damage window covers shorter winners.</desc>
