<text x="34" y="46" font-size="28" fill="#18334a" font-weight="700" text-anchor="start">Which K endpoints can challenge the baseline?</text>
<text x="34" y="76" font-size="18" fill="#18334a" font-weight="400" text-anchor="start">L = 8 example. A single edit touches at most one of the two halves.</text>
