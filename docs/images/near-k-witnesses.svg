<text x="784" y="305" font-size="17" fill="#18334a" font-weight="700" text-anchor="start">Report r − h, then add h</text>
<text x="784" y="328" font-size="15" fill="#18334a" font-weight="400" text-anchor="start">The older half is untouched.</text>
<text x="44" y="374" font-size="16" fill="#18334a" font-weight="400" text-anchor="start">Orange = the original mismatch repaired by the edit. Green = an exact witness.</text>
<rect x="24" y="422" width="1072" height="262" rx="12" fill="#ffffff" stroke="#d8e3eb" stroke-width="1"/>
<text x="44" y="454" font-size="21" fill="#18334a" font-weight="700" text-anchor="start">2  A shorter winner must damage the baseline occurrence</text>
<text x="44" y="482" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">Example: L = 8, baseline end r0 = 12. Enumerate [5, 20), clipped by r &lt; t.</text>
