<text x="617" y="165" font-size="16" fill="#18334a" font-weight="400" text-anchor="middle">Recent half: h = floor(L/2)</text>
<text x="44" y="209" font-size="17" fill="#18334a" font-weight="400" text-anchor="start">Q suffix</text>
