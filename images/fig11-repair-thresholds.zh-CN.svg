<text x="74.08" y="115.88" font-family="Consolas,Menlo,monospace" font-size="12" fill="#dc2626" text-anchor="start">s in [0,2] (left of window): repair must be len &gt;= 2 (strict) — an equal-length repair ends before r0 = 3 and LOSES the tie</text>
