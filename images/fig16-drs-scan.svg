<rect x="14" y="293.24" width="667.28" height="43.04" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="347.64" y="310.08" font-family="Consolas,Menlo,monospace" font-size="12" fill="#111827" text-anchor="middle">total: 8 skipped, 2 materialized  -&gt;  two prefix-sum arrays answer all 12 owner queries</text>
<text x="347.64" y="327.12" font-family="Consolas,Menlo,monospace" font-size="12" fill="#111827" text-anchor="middle">(drs_queries=12 = q_overlay 4 + k_overlay 8)</text>
<text x="14" y="28" font-family="Consolas,Menlo,monospace" font-size="14" fill="#111827" text-anchor="start" font-weight="bold">Figure 16 — the DRS scan: 14 requested points, 8 skipped by the payload LCE, 2 materialized</text>
<text x="14" y="61.88" font-family="Consolas,Menlo,monospace" font-size="12" fill="#2563eb" text-anchor="start">shift=-2 group: terms [5,5] (owner k=2), [6,6] (owner q=6), [7,7] (owner k=4)</text>
<text x="14" y="85.92" font-family="Consolas,Menlo,monospace" font-size="12" fill="#2563eb" text-anchor="start">merged interval: [5,7];  candidate payload V[t-2];  baseline label[t] = v[route[t]+1]</text>
<text x="14" y="109.96" font-family="Consolas,Menlo,monospace" font-size="12" fill="#111827" text-anchor="start" font-weight="bold">   t    candidate V[t-2]    baseline label    verdict</text>
<text x="14" y="134" font-family="Consolas,Menlo,monospace" font-size="12" fill="#dc2626" text-anchor="start">   5       V[3] = 0            V[6] = 1       MISMATCH  -&gt; materialize</text>
<text x="14" y="158.04" font-family="Consolas,Menlo,monospace" font-size="12" fill="#16a34a" text-anchor="start">   6,7     V[4],V[5] = 1,1     V[7],V[4] = 1,1 equal     -&gt; one LCE jump of 2</text>
<text x="14" y="191.08" font-family="Consolas,Menlo,monospace" font-size="12" fill="#2563eb" text-anchor="start">shift=-1 group: merged [5,7];  t=5: V[4] = label[5] = 1,  LCE = 3</text>
<text x="14" y="215.12" font-family="Consolas,Menlo,monospace" font-size="12" fill="#16a34a" text-anchor="start">   -&gt; one jump skips t = 5,6,7  (3 points at once)</text>
<text x="14" y="248.16" font-family="Consolas,Menlo,monospace" font-size="12" fill="#16a34a" text-anchor="start">shift=-5: [7,7]  V[2]=1 == label[7]=1  skip</text>
<text x="357.92" y="248.16" font-family="Consolas,Menlo,monospace" font-size="12" fill="#dc2626" text-anchor="start">shift=-4: [7,7]  V[3]=0 != 1  MISMATCH</text>
<text x="14" y="272.2" font-family="Consolas,Menlo,monospace" font-size="12" fill="#16a34a" text-anchor="start">shift=-3: [7,7]  V[4]=1 == 1           skip</text>
<text x="357.92" y="272.2" font-family="Consolas,Menlo,monospace" font-size="12" fill="#16a34a" text-anchor="start">shift= 0: [7,7]  V[7]=1 == 1  skip</text>
