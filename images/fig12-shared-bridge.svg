<text x="155.92" y="245.96" font-family="Consolas,Menlo,monospace" font-size="12" fill="#16a34a" text-anchor="start">after the flip: created match window q[3..5] == k&#x27;[0..2] == [0,0,1]</text>
<text x="155.92" y="267" font-family="Consolas,Menlo,monospace" font-size="12" fill="#111827" text-anchor="start">d = t - 5;  lifetime t in [5, 5+right] = [5,5];  route_at(5) = (left+1+0, k_pos+0) = (3, 2)</text>
<text x="155.92" y="288.04" font-family="Consolas,Menlo,monospace" font-size="12" fill="#111827" text-anchor="start">shift = k_pos - q_pos + 1 = -2  -&gt;  candidate payload V[t-2] = V[3]  (brute force: t=5 ell 5-&gt;3, route 4-&gt;2)</text>
