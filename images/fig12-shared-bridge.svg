<text x="240.92" y="118.36" font-family="Consolas,Menlo,monospace" font-size="12" fill="#dc2626" text-anchor="middle">differ in bit 0 — flip me</text>
<text x="155.92" y="203.88" font-family="Consolas,Menlo,monospace" font-size="12" fill="#16a34a" text-anchor="start">left = 2: equal context q[3..4] == k[0..1]</text>
