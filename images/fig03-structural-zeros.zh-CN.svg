<text x="497.04" y="56.26" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">6</text>
<text x="531.04" y="56.26" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">7</text>
<text x="14" y="111.88" font-family="Consolas,Menlo,monospace" font-size="12" fill="#6b7280" text-anchor="start">q[0] never matters:  it could only serve a full-prefix match ending at r = t, which is not a legal endpoint</text>
<text x="268.04" y="161.69" font-family="Consolas,Menlo,monospace" font-size="13" fill="#111827" text-anchor="end">k[t]</text>
<text x="293.04" y="135.3" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
<text x="327.04" y="135.3" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">1</text>
<text x="361.04" y="135.3" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">2</text>
<text x="395.04" y="135.3" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">3</text>
<text x="429.04" y="135.3" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">4</text>
<text x="463.04" y="135.3" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">5</text>
<text x="497.04" y="135.3" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">6</text>
<text x="531.04" y="135.3" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">7</text>
<text x="155.36" y="190.92" font-family="Consolas,Menlo,monospace" font-size="12" fill="#6b7280" text-anchor="start">K[T-1] is never an endpoint:  an endpoint r must satisfy r &lt; t &lt;= T-1</text>
<text x="268.04" y="240.73" font-family="Consolas,Menlo,monospace" font-size="13" fill="#111827" text-anchor="end">v_bits[t]</text>
<text x="293.04" y="214.34" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
<text x="327.04" y="214.34" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">1</text>
<text x="361.04" y="214.34" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">2</text>
<text x="395.04" y="214.34" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">3</text>
<text x="429.04" y="214.34" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">4</text>
<text x="463.04" y="214.34" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">5</text>
<text x="497.04" y="214.34" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">6</text>
<text x="531.04" y="214.34" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">7</text>
<text x="147.92" y="269.96" font-family="Consolas,Menlo,monospace" font-size="12" fill="#6b7280" text-anchor="start">V[0] is never read:  route[t] &gt;= 0  =&gt;  payload index = route[t]+1 &gt;= 1</text>
