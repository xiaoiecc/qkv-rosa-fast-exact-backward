<text x="276.04" y="28" font-family="Consolas,Menlo,monospace" font-size="14" fill="#111827" text-anchor="start" font-weight="bold">Figure 3 — three structural zeros of the payload rule (running instance)</text>
<text x="268.04" y="82.65" font-family="Consolas,Menlo,monospace" font-size="13" fill="#111827" text-anchor="end">q[t]</text>
<text x="293.04" y="56.26" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">0</text>
<text x="327.04" y="56.26" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">1</text>
<text x="361.04" y="56.26" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">2</text>
<text x="395.04" y="56.26" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">3</text>
<text x="429.04" y="56.26" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">4</text>
