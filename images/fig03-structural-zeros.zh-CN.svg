<text x="434.32" y="56.26" font-family="Consolas,Menlo,monospace" font-size="11" fill="#9ca3af" text-anchor="middle">7</text>
<text x="14" y="111.88" font-family="Consolas,Menlo,monospace" font-size="12" fill="#6b7280" text-anchor="start">q[0] 从不起作用：它只能服务于一条结束于 r = t 的全前缀匹配，而 r = t 不是合法端点</text>
