<text x="84.68" y="269.96" font-family="Consolas,Menlo,monospace" font-size="12" fill="#6b7280" text-anchor="start">V[0] 从不被读取：route[t] &gt;= 0  =&gt;  负载下标 = route[t]+1 &gt;= 1</text>
