<text x="130.72" y="135.54" font-family="Consolas,Menlo,monospace" font-size="13" fill="#111827" text-anchor="middle">每次前向都重新推导全部：</text>
<text x="130.72" y="154" font-family="Consolas,Menlo,monospace" font-size="13" fill="#111827" text-anchor="middle">  每一次后缀比较</text>
<text x="130.72" y="172.46" font-family="Consolas,Menlo,monospace" font-size="13" fill="#111827" text-anchor="middle">  每一次平局决胜</text>
<text x="130.72" y="190.92" font-family="Consolas,Menlo,monospace" font-size="13" fill="#111827" text-anchor="middle">  每一次负载读取</text>
