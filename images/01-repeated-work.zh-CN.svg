<rect x="556" y="86" width="316" height="305" rx="10" fill="white" stroke="#d8e1ec"/>
<text x="575" y="115" font-size="17" fill="#172033" text-anchor="start" font-weight="700">每个蓝格内部</text>
<text x="575" y="147" font-size="13" fill="#56657a" text-anchor="start" font-weight="400">扫描因果终点 r &lt; t</text>
<text x="575" y="169" font-size="13" fill="#56657a" text-anchor="start" font-weight="400">逐字符向左匹配</text>
<text x="575" y="191" font-size="13" fill="#56657a" text-anchor="start" font-weight="400">按 (长度, 终点) 取最大</text>
<line x1="575" y1="213" x2="850" y2="213" stroke="#d8e1ec" stroke-width="1.5"/>
<text x="575" y="241" font-size="21" fill="#2563eb" text-anchor="start" font-weight="700">3TD × T × T × T</text>
<text x="575" y="273" font-size="25" fill="#2563eb" text-anchor="start" font-weight="700">主导项 O(DT⁴)</text>
<text x="575" y="311" font-size="13" fill="#56657a" text-anchor="start" font-weight="400">灰格完全相同；蓝格也共享</text>
<text x="575" y="333" font-size="13" fill="#56657a" text-anchor="start" font-weight="400">不跨过 owner 的匹配。</text>
<text x="28" y="419" font-size="13" fill="#56657a" text-anchor="start" font-weight="400">优化顺序：不变答案 → 共同删除 → 一处失配修复 → 压缩实际记录与生命周期。</text>
</g>
