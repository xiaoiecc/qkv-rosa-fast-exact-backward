<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1197.68" height="292.04" viewBox="0 0 1197.68 292.04" role="img" aria-label="Figure 5 — from credit to logit: the orient map, with measured numbers (D=2 demo, τ = 0.5)">
<title>Figure 5 — from credit to logit: the orient map, with measured numbers (D=2 demo, τ = 0.5)</title>
<desc>The orient map from bit-flip credit to logit gradient, with one measured example.</desc>
<defs><marker id="arr-dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arr-374151" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<rect x="0" y="0" width="1197.68" height="292.04" fill="#ffffff"/>
<path d="M 153.04 116.88 L 533.04 116.88" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-dc2626)"/>
<path d="M 1044.64 116.88 L 664.64 116.88" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-dc2626)"/>
