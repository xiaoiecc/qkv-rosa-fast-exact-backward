<text x="83.52" y="120.72" font-family="Consolas,Menlo,monospace" font-size="12" fill="#111827" text-anchor="middle">bit = 0  (z &lt; 0)</text>
<rect x="533.04" y="103.88" width="131.6" height="26" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="598.84" y="120.72" font-family="Consolas,Menlo,monospace" font-size="12" fill="#111827" text-anchor="middle">threshold z = 0</text>
<rect x="1044.64" y="103.88" width="139.04" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="1114.16" y="120.72" font-family="Consolas,Menlo,monospace" font-size="12" fill="#111827" text-anchor="middle">bit = 1  (z &gt; 0)</text>
<text x="14" y="28" font-family="Consolas,Menlo,monospace" font-size="14" fill="#111827" text-anchor="start" font-weight="bold">Figure 5 — from credit to logit: the orient map, with measured numbers (D=2 demo, τ = 0.5)</text>
<text x="343.04" y="106.84" font-family="Consolas,Menlo,monospace" font-size="12" fill="#dc2626" text-anchor="middle">flip pushes z upward across it:  orient = +1</text>
<text x="854.64" y="133.88" font-family="Consolas,Menlo,monospace" font-size="12" fill="#dc2626" text-anchor="middle">flip pushes z downward across it:  orient = −1</text>
<text x="14" y="197.88" font-family="Consolas,Menlo,monospace" font-size="12" fill="#111827" text-anchor="start">position 1, bit-plane 1:  credit = +0.049447, bit = 0 -&gt; orient = +1</text>
<text x="14" y="222.92" font-family="Consolas,Menlo,monospace" font-size="12" fill="#2563eb" text-anchor="start">z = 0.7507, tau = 0.5:  sigma(z/tau) = 0.8178</text>
<text x="14" y="247.96" font-family="Consolas,Menlo,monospace" font-size="12" fill="#111827" text-anchor="start">identity : grad = +1 × 0.049447                    = +0.049447</text>
<text x="14" y="273" font-family="Consolas,Menlo,monospace" font-size="12" fill="#16a34a" text-anchor="start">bernoulli: grad = 0.8178 × 0.1822 / 0.5 × 0.049447 = +0.014737</text>
